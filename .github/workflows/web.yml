name: Calidad de Aulify

on:
  push:
    branches: [main]
    paths:
      [
        'src/**',
        'public/**',
        'tests/**',
        'supabase/migrations/**',
        'tools/datos/check.mjs',
        'tools/datos/scoring-acceptance.mjs',
        'tools/datos/teacher-projection-check.mjs',
        'tools/datos/game-acceptance.mjs',
        'tools/datos/participant-sync-check.mjs',
        'package.json',
        'package-lock.json',
        '*config*',
        'tsconfig.json',
        'vercel.json',
        '.github/workflows/web.yml',
      ]
  pull_request:
    branches: [main]
    paths:
      [
        'src/**',
        'public/**',
        'tests/**',
        'supabase/migrations/**',
        'tools/datos/check.mjs',
        'tools/datos/scoring-acceptance.mjs',
        'tools/datos/teacher-projection-check.mjs',
        'tools/datos/game-acceptance.mjs',
        'tools/datos/participant-sync-check.mjs',
        'package.json',
        'package-lock.json',
        '*config*',
        'tsconfig.json',
        'vercel.json',
        '.github/workflows/web.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, reglas y recorridos de demostración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Obtener la revisión
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Comprobar formato
        run: npm run format:check
      - name: Analizar código
        run: npm run lint
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Verificar reglas del dominio
        run: npm test
      - name: Verificar migraciones y permisos en PostgreSQL aislado
        run: node tools/datos/check.mjs
      - name: Verificar casos numéricos de puntuación
        run: node tools/datos/scoring-acceptance.mjs
      - name: Verificar equivalencia y permisos de la proyección docente
        run: node tools/datos/teacher-projection-check.mjs
      - name: Verificar participación, equipos y privacidad de publicación
        run: node tools/datos/game-acceptance.mjs
      - name: Verificar revisiones independientes por participante
        run: node tools/datos/participant-sync-check.mjs
      - name: Construir aplicación
        run: npm run build
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Comprobar recorridos y accesibilidad automática
        run: npm run test:e2e
      - name: Conservar informe y evidencia de fallos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verificacion-web-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            docs/verificacion/datos-proyeccion-docente-aislada.json
            docs/verificacion/juego-aceptacion-aislada.json
          if-no-files-found: ignore
          retention-days: 14
